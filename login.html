<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-header bg-dark text-white text-center">INICIAR SESIÓN</div>
                    <div class="card-body">
                        <form id="frmLogin">
                            <div class="mb-2">
                                <input required maxlength="35" placeholder="Usuario" name="txtUsuarioLogin" id="txtUsuarioLogin" class="form-control" type="text">
                            </div>
                            <div class="mb-3">
                                <input required maxlength="35" placeholder="Clave" name="txtClaveLogin" id="txtClaveLogin" class="form-control" type="password">
                            </div>
                            <div class="text-center">
                                <input type="submit" value="Ingresar" class="btn btn-primary">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Si ya habia una sesion anterior, se limpia al volver al login
        sessionStorage.removeItem('usuario');

        frmLogin.addEventListener('submit', (e) => { e.preventDefault(); iniciarSesion(); });

        async function iniciarSesion() {
            let datos = { usuario: txtUsuarioLogin.value, clave: txtClaveLogin.value };
            let response = await fetch('/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos)
            });
            let respuesta = await response.json();
            if (respuesta.msg != "ok") {
                alert("Acceso denegado: " + respuesta.msg);
                txtClaveLogin.value = '';
                return;
            }
            sessionStorage.setItem('usuario', txtUsuarioLogin.value);
            window.location.href = '/usuarios.html';
        }
    </script>
</body>

</html>
